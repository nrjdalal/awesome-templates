[project]
name = "fastapi-agent-blueprint"
version = "0.11.1"
description = "FastAPI backend blueprint for AI agent apps: DDD domains, SQLAlchemy, Taskiq, RAG infra, and Claude/Codex collaboration harness"
readme = "README.md"
requires-python = ">=3.12.9"
keywords = [
    "fastapi",
    "backend-blueprint",
    "clean-architecture",
    "domain-driven-design",
    "dependency-injection",
    "ai-agents",
    "ai-assisted-development",
    "coding-agents",
    "llm",
    "rag",
    "backend-template",
    "fastapi-template",
    "sqlalchemy",
    "alembic",
    "pydantic",
    "claude-code",
    "codex-cli",
    "taskiq",
    "nicegui",
    "pydantic-ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Framework :: FastAPI",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.14.3",
    "aiomysql>=0.2.0",
    "alembic>=1.15.2",
    "asgi-correlation-id>=4.3.0",
    "asyncpg>=0.30.0",
    "bcrypt>=4.3.0",
    "dependency-injector>=4.46.0",
    "email-validator>=2.0.0",
    "fastapi>=0.115.12",
    "greenlet>=3.2.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2.12",
    "pydantic-settings>=2.14.2",
    "pymysql>=1.1.1",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.40",
    "structlog>=25.0.0",
    "taskiq[reload]>=0.12.1",
    "semantic-text-splitter>=0.17.0",
    "uvicorn>=0.34.1",
]

[project.optional-dependencies]
admin = ["nicegui>=3.12.0"]
# Kept installable after 0.9.0 removed it from core: nothing in the repo
# invokes gunicorn (the only mention is a commented-out block in
# run_server_local.py), but adopters who relied on the executable arriving
# with a plain install need a path that does not break.
server-gunicorn = ["gunicorn>=23.0.0"]
aws = [
    "aioboto3>=15.4.0",
    "boto3>=1.39.12",
    "types-aioboto3>=15.4.0",
    "types-aiobotocore-dynamodb>=2.25.0",
    "types-aiobotocore-s3>=2.25.0",
    "types-aiobotocore-s3vectors>=3.5.0",
]
sqs = ["taskiq-aws>=0.4.0"]
rabbitmq = ["taskiq-aio-pika>=0.4.0"]
openai = ["openai>=1.0.0", "tiktoken>=0.7.0"]
pydantic-ai = ["pydantic-ai-slim[openai]>=1.99.0,<2", "tiktoken>=0.7.0"]
pydantic-ai-anthropic = ["pydantic-ai-slim[anthropic]>=1.99.0,<2"]
pydantic-ai-google = ["pydantic-ai-slim[google]>=1.99.0,<2"]
pydantic-ai-duckduckgo = ["pydantic-ai-slim[duckduckgo]>=1.99.0,<2"]
otel = [
    "opentelemetry-api>=1.40.0",
    "opentelemetry-sdk>=1.40.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.40.0",
]

# Type checking. pyright was a declared dev dependency with zero invocation
# sites anywhere in the repo (#333) — the pre-commit mypy hook is
# `stages: [manual]`, so `pre-commit run --all-files` skipped it and the CI
# `architecture` job type-checked nothing at all.
#
# Coverage. `include` reached all of `src` in #381 (91 errors -> 0) and now covers
# everything the retired mypy hook nominally covered, plus the shared governor
# package and the root runners, which it never did (#375).
#
# mypy is gone rather than repaired. It aborted during module resolution — two
# harness copies of `completion_gate.py` map to one top-level module name — so it
# reported one error and inspected nothing under `src/`. Two checkers with
# different scopes, one unable to run, is worse than one. And even repaired it
# would have been shallow: its `additional_dependencies` were `types-requests` and
# `pydantic` only, so with `--ignore-missing-imports` every fastapi, sqlalchemy and
# nicegui type resolved to Any.
#
# `exclude` is set explicitly, which is load-bearing: pyright's default excludes
# `**/.*`, so a dot-directory named in `include` is silently skipped. Measured
# before overriding it — `.claude/hooks` reported "0 errors" while analysing 0 of
# its 7 files. `test_pyright_scope.py` pins that pairing, because "0 errors"
# and "nothing checked" print the same way, which is the exact failure that let
# the mypy hook look like coverage for two releases.
#
# The three harness hook directories joined in #387. 177 errors became 0, and the
# split was not what it looked like: 70 were unresolved imports that `extraPaths`
# fixed outright, 88 were `# type: ignore` comments left orphaned by retiring
# mypy, and the 19 that remained were real — a fallback stub whose signature did
# not match what it stands in for, one name the fail-open `except` branch forgot
# to give a sentinel, and 17 call sites guarded by an `_OK` flag that nothing
# links to the `None` sentinels it sets.
#
# `tests/` joined last (#394-#399). It started at 155 findings and the split was
# not "test noise": a `cast` in `BaseService.create_datas` that existed only because
# `list` is invariant, three functions asking for a class where they use one method,
# and two test doubles that had silently stopped matching the protocols they
# impersonate — one missing `count_datas_by_day` since #368, one still naming a
# parameter `user_id` that the admin realm renamed in #218.
#
# Never widen coverage by relaxing the rules below.
[tool.pyright]
include = [
    "src",
    "tests",
    "tools",
    "scripts",
    "examples",
    # The shared governor package every harness hook imports. Clean already; it
    # had no type checker looking at it because it lives in a dot-directory.
    ".agents",
    # The three harness hook copies (#387). They are runtime scripts, not shipped
    # code, but the failure they risk is a hook degrading into a no-op — which is
    # precisely what the retired mypy stage demonstrated.
    ".claude/hooks",
    ".antigravity/hooks",
    ".codex/hooks",
    # mypy excluded `run_.*\.py$`. Including them found that `make scheduler` had
    # never run the scheduler: `run_scheduler` is a coroutine function and the call
    # dropped it. Pinned by tests/unit/test_local_runners.py.
    "run_server_local.py",
    "run_worker_local.py",
    "run_scheduler_local.py",
]
exclude = ["**/node_modules", "**/__pycache__", "**/.venv"]
# The hooks reach the shared governor package by inserting `.agents/shared` on
# `sys.path` at import time, so `harness_debug` / `governor.*` are top-level names
# that no static resolver can find on its own. This is what turned 70 of #387's
# findings into zero — and it also revealed two orphaned ignores in
# `tools/check_governor_footer.py`, a file already in the gate whose imports had
# been silently unresolved.
extraPaths = [".agents/shared"]
# Suppressions cannot rot: an ignore comment that stops being needed is an error.
# Enabling this is what retiring mypy bought — it reported 3 errors while the hook
# existed, and 2 were mypy-only `# type: ignore` comments pyright does not need.
# Those are gone, and the remaining suppressions are `# pyright: ignore[rule]` so
# each names the one rule it silences.
reportUnnecessaryTypeIgnoreComment = "error"
pythonVersion = "3.12"
typeCheckingMode = "standard"

[project.urls]
Homepage = "https://github.com/Mr-DooSun/fastapi-agent-blueprint"
Repository = "https://github.com/Mr-DooSun/fastapi-agent-blueprint"
Issues = "https://github.com/Mr-DooSun/fastapi-agent-blueprint/issues"
Changelog = "https://github.com/Mr-DooSun/fastapi-agent-blueprint/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "anyio[asyncio]>=4.0.0",
    "locust>=2.37.11",
    "pip-audit>=2.10.0",
    "pre-commit>=4.2.0",
    "pyright>=1.1.408",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.15.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = [".agents/shared"]
markers = [
    "slow: spawns a subprocess per test — container wiring probes that cannot\n           run in-process (see tests/support/container_env.py)",
    "dynamodb: requires dynamodb-local at http://localhost:8000 (see make test-dynamo)",
]

# === Ruff Configuration ===
[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "UP",   # pyupgrade
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit
]
ignore = [
    "F841",   # local variable assigned but never used
    "E501",   # line too long (handled by formatter)
    "E402",   # module level import not at top
    "F401",   # unused import
    "B008",   # function call in default argument
    "B006",   # mutable default argument
    "C901",   # too complex
    "SIM102", # use single if instead of nested if
    "SIM114", # combine if branches with same body
    "SIM117", # multiple with statements
    "SIM910", # use dict.get(key) instead of dict.get(key, None)
    "B904",   # raise without from inside except
    "UP046",  # non-PEP695 generic class
    "S113",   # request without timeout (was bandit B113)
    "S314",   # use of xml.etree.ElementTree (was bandit B314)
    "S413",   # use of pycrypto (was bandit B413)
    "S607",   # starting process with partial executable path
]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.per-file-ignores]
"**/routers/*.py" = ["B008"]
"**/workflows/*.py" = ["B006"]
"tests/**/*.py" = ["S"]
"*_test.py" = ["S"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
