name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        run: |
          BRANCH="${{ github.head_ref }}"
          PATTERN="^(feat|fix|refactor|docs|chore|test|i18n|ci|perf|style)/[a-z0-9]([a-z0-9._-]*[a-z0-9])?$"
          if [[ ! "$BRANCH" =~ $PATTERN ]]; then
            echo "::error::Branch name '$BRANCH' does not follow the required format: {type}/{description}"
            echo "Valid types: feat, fix, refactor, docs, chore, test, i18n, ci, perf, style"
            echo "Example: feat/add-user-auth, fix/null-pointer-in-service"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Ruff check
        run: uv run ruff check src/

      - name: Ruff format check
        run: uv run ruff format --check src/

  test:
    # The matrix is the point of #333: this job exported DATABASE_ENGINE:
    # postgresql but never set TEST_DB_ENGINE — the variable
    # tests/conftest.py::test_db actually reads — so every run was SQLite and
    # PostgreSQL, the production default, had never been exercised. The first
    # run of the postgres leg found a foreign key the SQLite leg cannot see
    # (#348).
    #
    # MySQL is deliberately absent: whether it joins is coupled to the open
    # cluster D decision in #325.
    name: test (fixture db ${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [sqlite, postgresql]
    services:
      dynamodb-local:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
      # Always started. GitHub Actions does not support conditional service
      # containers, and an idle postgres costs a few seconds against the
      # clarity of one service block per engine.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --group dev --extra admin --extra aws

      - name: Run tests
        env:
          ENV: local
          ADMIN_BOOTSTRAP_ENABLED: "false"
          ADMIN_STORAGE_SECRET: ci-test-secret
          DATABASE_ENGINE: postgresql
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: "5432"
          DATABASE_NAME: postgres
          AWS_SQS_ACCESS_KEY: test
          AWS_SQS_SECRET_KEY: test
          AWS_SQS_URL: http://localhost:4566
          # This is the switch conftest reads, and the only thing the matrix
          # varies. DATABASE_ENGINE above stays postgresql on both legs: it
          # configures the application object under test, which the e2e fixtures
          # then re-point at test_db anyway. The job name says "fixture db" for
          # exactly this reason — the sqlite leg is not an all-SQLite run.
          TEST_DB_ENGINE: ${{ matrix.engine }}
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: postgres
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: "5432"
          TEST_DB_NAME: postgres
        run: uv run pytest tests/ -v --tb=short

  # Minimal-install boot regression: confirm the app boots and serves /api/health
  # with only core deps installed (no admin / aws / sqs / pydantic-ai extras).
  # This is the acceptance guard for #101's "optional extra uninstall → still
  # boots" promise, extended by #104 for the admin + aws extras.
  minimal-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core-only dependencies
        run: uv sync --locked --group dev

      - name: Run no-extras boot regression tests
        env:
          ENV: quickstart
          ADMIN_BOOTSTRAP_ENABLED: "false"
          ADMIN_STORAGE_SECRET: ci-test-secret
          DATABASE_ENGINE: sqlite
          DATABASE_NAME: ":memory:"
          DATABASE_USER: unused
          DATABASE_PASSWORD: unused
          DATABASE_HOST: unused
          DATABASE_PORT: "0"
          BROKER_TYPE: inmemory
        run: uv run pytest tests/integration/_core/test_minimal_install.py -v --tb=short

  # #333: pyright and pip-audit were declared dev dependencies with zero
  # invocation sites, and the mypy pre-commit hook is `stages: [manual]` so the
  # architecture job's `pre-commit run --all-files` skipped it. Nothing in CI
  # type-checked anything, and no dependency CVE scan ran at all.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The extras are not optional here. [tool.pyright] include covers
      # src/user, which contains an admin page importing nicegui; a core-only
      # install makes pyright report reportMissingImports rather than type-check
      # it. The same environment is what pip-audit needs to see the optional
      # production dependencies, so install it once.
      - name: Install dependencies
        run: uv sync --locked --group dev --extra admin --extra aws --extra sqs --extra rabbitmq

      # Scope comes from [tool.pyright] in pyproject.toml: an allow-list of the
      # packages that are clean today, not all of src/ (58 errors). Blocking on
      # purpose — an advisory type check is what the manual-stage mypy hook
      # already was, and it caught nothing for two releases.
      - name: Pyright
        run: uv run pyright

      # Advisory. A newly published CVE would otherwise turn a green PR red with
      # no change to the code, and §0 keeps hard-blocking automation a non-goal.
      #
      # Installs the shipped extras first: auditing a core-only environment
      # would silently exclude nicegui, aioboto3 and the taskiq brokers, which
      # are production dependencies for anyone who enables them. The result goes
      # to the job summary rather than only the log, so an advisory step is
      # something a reviewer sees instead of something they have to go find.
      # Current backlog and the case for making this blocking later: #349.
      - name: Dependency CVE scan (advisory)
        continue-on-error: true
        run: |
          set +e
          uv run pip-audit --progress-spinner off > audit.txt 2>&1
          code=$?
          {
            echo "## Dependency CVE scan (advisory)"
            echo
            if [ "$code" -eq 0 ]; then
              echo "No known advisories."
            else
              echo '```'
              cat audit.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat audit.txt

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Install pre-commit
        run: uv run pre-commit install

      - name: Run architecture checks
        run: uv run pre-commit run --all-files

      # The gitleaks pre-commit hook is `gitleaks git --pre-commit --staged` with
      # pass_filenames: false, so the step above does NOT scan it: on a clean
      # checkout there is no staged diff and the hook reports
      # `0 commits scanned. scanned ~0 bytes`. Until this step existed the secret
      # gate was purely local — a PR from a contributor who skipped the hook was
      # never re-checked. This scans the whole working tree instead (#320).
      - name: Scan the full checkout for committed secrets
        env:
          # Keep in lockstep with the `rev:` pinned for gitleaks in
          # .pre-commit-config.yaml so local and CI enforce one ruleset.
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
          /tmp/gitleaks dir --config .gitleaks.toml --redact --no-banner --exit-code 1 .
